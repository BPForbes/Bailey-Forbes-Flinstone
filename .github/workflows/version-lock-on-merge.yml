# After a push to develop, copy version/entries → version/locked and regenerate
# userland/shell/version_def.h. If anything changed, opens a PR into develop.
#
# Requires repository **Settings → Actions → General**: workflow **Read and write**
# permission and **Allow GitHub Actions to create and approve pull requests**
# (unless you use a PAT below).
#
# Optional: set repository secret **VERSION_LOCK_PAT** (fine-grained classic PAT with
# **contents: write** and **pull-requests: write** on this repo). If unset,
# **GITHUB_TOKEN** is used after the settings above are enabled.
#
# Needs: permissions contents: write, pull-requests: write.

name: Version lock on merge

on:
  push:
    branches: [develop]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: version-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-locked-from-entries:
    name: Sync version/locked from entries
    runs-on: ubuntu-latest
    # Avoid a loop when the tip commit is already our sync squash (optional guard).
    if: "${{ github.event.head_commit == null || !startsWith(github.event.head_commit.message, 'chore(version): sync') }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.VERSION_LOCK_PAT || secrets.GITHUB_TOKEN }}

      - name: Finalize version (copy version/entries to version/locked)
        run: ./scripts/finalize_version_locked.sh

      - name: Regenerate version header
        run: ./scripts/gen_version_def.sh

      - name: Detect changes
        id: prep
        run: |
          set -euo pipefail
          if git diff --quiet HEAD -- version/locked userland/shell/version_def.h; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No version/locked or version_def.h changes after finalize."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request with synced locked + header
        if: steps.prep.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.VERSION_LOCK_PAT || secrets.GITHUB_TOKEN }}
          commit-message: "chore(version): sync version/locked from entries after merge"
          branch: cursor/version-lock-from-entries-${{ github.run_id }}
          title: "chore(version): sync version/locked from entries after merge to develop"
          body: |
            Automated sync after a push to `develop`: ran `finalize_version_locked.sh` and `gen_version_def.sh`.

            Merge this PR to publish `version/locked/` and `userland/shell/version_def.h`.

            Uses repository secret `VERSION_LOCK_PAT` when set; otherwise `GITHUB_TOKEN` (requires **Allow GitHub Actions to create and approve pull requests**).
