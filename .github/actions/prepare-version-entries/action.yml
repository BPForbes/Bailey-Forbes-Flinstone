name: Prepare version/entries
description: >-
  Relocate non-GM root PRERELEASE=1 *.ver into preproduction A.B.C/, normalize
  duplicate GM candidates, promote GM=1 preproduction rows to root GA .ver (and remove
  those preproduction trees), stamp missing RELEASE_DATE on the entries root and active
  preproduction */ trees, copy version/entries → version/locked (skip preproduction */),
  then gen_version_def.sh can read locked + entries (idempotent per checkout).
runs:
  using: composite
  steps:
    - name: Relocate non-GM root PRERELEASE=1 .ver into preproduction
      shell: bash
      working-directory: ${{ github.workspace }}
      run: bash scripts/relocate_root_prerelease_ver_to_preproduction.sh

    - name: Normalize duplicate GM=1 candidates
      shell: bash
      working-directory: ${{ github.workspace }}
      run: bash scripts/promote_preproduction_for_main.sh --normalize-gm-only

    - name: Promote GM=1 preproduction rows to root GA .ver
      shell: bash
      working-directory: ${{ github.workspace }}
      run: bash scripts/promote_preproduction_for_main.sh

    - name: Stamp RELEASE_DATE on entries root and preproduction trees
      shell: bash
      working-directory: ${{ github.workspace }}
      run: bash scripts/stamp_version_entries_release_date.sh
