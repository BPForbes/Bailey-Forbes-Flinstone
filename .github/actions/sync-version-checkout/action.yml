name: Sync version checkout for CI build
description: >-
  After the versioning job, pick up bot-pushed version files without abandoning
  the PR merge checkout: on pull_request, overlay userland/shell/version_def.h
  and version/entries from origin/<head>; on push, overlay from origin/<ref>.
  Then relocate idempotently and regenerate version_def.h.
runs:
  using: composite
  steps:
    - name: Sync version paths from branch tip (keep PR merge checkout on pull_request)
      if: >-
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'push' &&
         github.ref != 'refs/heads/develop' &&
         github.ref != 'refs/heads/main')
      env:
        GITHUB_TOKEN: ${{ github.token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GIT_HEAD_REF: ${{ github.head_ref }}
        GIT_REF_NAME: ${{ github.ref_name }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        if [[ -z "${GITHUB_TOKEN}" ]]; then
          echo "sync-version-checkout: GITHUB_TOKEN is required" >&2
          exit 1
        fi
        git remote set-url origin \
          "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

        version_ref=""
        if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
          if [[ -n "${GIT_HEAD_REF}" ]]; then
            git fetch --no-tags origin "${GIT_HEAD_REF}"
            version_ref="origin/${GIT_HEAD_REF}"
          elif [[ -n "${PR_HEAD_SHA}" ]]; then
            git fetch --no-tags origin "${PR_HEAD_SHA}"
            version_ref="${PR_HEAD_SHA}"
          else
            echo "sync-version-checkout: pull_request missing head ref and head SHA" >&2
            exit 1
          fi
        else
          if [[ -z "${GIT_REF_NAME}" ]]; then
            echo "sync-version-checkout: push missing ref name" >&2
            exit 1
          fi
          git fetch --no-tags origin "${GIT_REF_NAME}"
          version_ref="origin/${GIT_REF_NAME}"
        fi

        if ! git rev-parse --verify --quiet "${version_ref}" >/dev/null 2>&1; then
          echo "sync-version-checkout: cannot resolve ${version_ref}" >&2
          exit 1
        fi
        git checkout "${version_ref}" -- userland/shell/version_def.h 2>/dev/null || true
        git checkout "${version_ref}" -- version/entries 2>/dev/null || true

    - name: Prepare version/entries (relocate, normalize GM, stamp dates)
      uses: ./.github/actions/prepare-version-entries

    - name: Regenerate userland/shell/version_def.h from .ver trees
      shell: bash
      working-directory: ${{ github.workspace }}
      run: ./scripts/gen_version_def.sh
