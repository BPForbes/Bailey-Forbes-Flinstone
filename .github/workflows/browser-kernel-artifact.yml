name: Browser kernel artifact

# Builds the browser lab of the pushed branch and publishes it to its own slot
# on the deployment branch (scripts/publish_pages_slot.sh), which GitHub Pages
# then serves whole:
#   main    - the default lab, at the site root (and its security variant at /security/)
#   develop - the in-development lab, at /develop/
# Each branch writes only its own slot, so a main deploy keeps the develop lab
# and a develop deploy keeps the main lab. Pull requests build and test only.

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: browser-kernel-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lab build
    uses: ./.github/workflows/browser-lab-build.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      # The pushed commit; a pull request builds its own merge commit.
      ref: ""
      artifact_suffix: ""
      # Every push to main or develop publishes this build to its own slot, so
      # its metadata marks it published (lab.published); pull requests never do.
      publish: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') }}

  publish:
    name: Publish lab to the deployment branch
    needs: build
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') &&
      needs.build.outputs.bootable == 'true' &&
      needs.build.outputs.browser_compatible == 'true' &&
      needs.build.outputs.boot_smoke_passed == 'true'
    runs-on: ubuntu-latest
    # Queued per branch: GitHub keeps one pending job per group, so only an older
    # publish of the same branch can be dropped, never the other slot's. A main
    # and a develop publish may overlap; the script retries when the branch moved.
    concurrency:
      group: pages-publish-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: write   # push the deployment branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5

      - name: Download validated lab
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flintstone-browser-lab
          path: ${{ runner.temp }}/lab

      - name: Publish this branch's slot
        env:
          SLOT: ${{ github.ref == 'refs/heads/main' && 'main' || 'develop' }}
          LAB: ${{ runner.temp }}/lab
          SITE: ${{ runner.temp }}/site
        run: |
          ./scripts/publish_pages_slot.sh "$SLOT" "$LAB" "$SITE"
          echo "${SLOT} lab published to the publisher branch" >>"$GITHUB_STEP_SUMMARY"

  deploy:
    name: Publish validated lab to GitHub Pages
    needs: publish
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Deploys whatever the deployment branch holds when it runs, so a pending
    # deploy that a newer one replaces loses nothing: the newer one deploys the
    # newer branch. Never cancelled half way.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Check out the deployment branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          ref: publisher
          path: site
          persist-credentials: false

      - name: Check for the main lab
        id: site
        run: |
          {
            echo "## Deployment branch $(git -C site rev-parse --short HEAD)"
            echo
            if [ -f site/index.html ]; then echo "- main lab: present"; else echo "- main lab: absent, Pages not deployed"; fi
            if [ -f site/develop/index.html ]; then echo "- develop lab: present"; else echo "- develop lab: absent"; fi
          } >>"$GITHUB_STEP_SUMMARY"
          # Until main has published a lab at the root, deploying would take the
          # site root down; leave the current site in place.
          if [ -f site/index.html ]; then echo "deploy=true"; else echo "deploy=false"; fi >>"$GITHUB_OUTPUT"

      - name: Stage Pages payload
        if: steps.site.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site

      - name: Configure Pages
        if: steps.site.outputs.deploy == 'true'
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Deploy Pages
        if: steps.site.outputs.deploy == 'true'
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
