name: Browser kernel artifact

# Two builds of the browser lab, both with the same gates:
#   main    - the default lab, at the site root (and the security variant at /security/)
#   develop - the in-development lab, at /develop/
# Every push to main or develop rebuilds both and republishes the whole Pages
# site, because a Pages deploy replaces everything. The develop build is left
# out of a deploy when it fails its own gates, and the portfolio then shows
# "In development build unavailable".

on:
  pull_request:
  push:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: browser-kernel-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  main:
    name: Main build
    uses: ./.github/workflows/browser-lab-build.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      ref: ""
      artifact_suffix: ""
      publish: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

  develop:
    name: Develop build
    if: github.event_name == 'push'
    uses: ./.github/workflows/browser-lab-build.yml
    permissions:
      contents: read
      pull-requests: read
    with:
      ref: develop
      artifact_suffix: "-develop"
      publish: false
      # A failing develop build must not fail the main run: the run's success is
      # what the portfolio notification waits for. The deploy below checks the
      # develop outputs, so a failed develop build is left out of the site.
      allow_failure: true

  deploy:
    name: Publish validated lab to GitHub Pages
    needs: [main, develop]
    if: >-
      always() &&
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/develop') &&
      needs.main.result == 'success' &&
      needs.main.outputs.bootable == 'true' &&
      needs.main.outputs.browser_compatible == 'true' &&
      needs.main.outputs.boot_smoke_passed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # One Pages deploy at a time: a main push and a develop push both rebuild
    # the whole site, and the later deploy must not be cancelled half way.
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Download validated main lab
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flintstone-browser-lab
          path: dist/browser-lab

      - name: Download validated develop lab
        if: >-
          needs.develop.result == 'success' &&
          needs.develop.outputs.bootable == 'true' &&
          needs.develop.outputs.browser_compatible == 'true' &&
          needs.develop.outputs.boot_smoke_passed == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: flintstone-browser-lab-develop
          path: dist/browser-lab/develop

      - name: Report which builds are in the payload
        run: |
          test -f dist/browser-lab/index.html
          if [ -f dist/browser-lab/develop/index.html ]; then
            echo "develop: included" >>"$GITHUB_STEP_SUMMARY"
          else
            echo "develop: not included (its gates did not pass)" >>"$GITHUB_STEP_SUMMARY"
          fi

      - name: Stage Pages payload
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist/browser-lab

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
