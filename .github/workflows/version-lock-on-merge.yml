# After a push to develop, copy version/entries → version/locked (excluding top-level
# preproduction */ trees), regenerate userland/shell/version_def.h. If anything changed,
# opens a PR into develop (do not
# push that commit directly to develop — branch rules usually require a PR, checks,
# and often verified signatures), then enables GitHub auto-merge on that PR so it
# completes when required checks pass.
#
# Requires **Settings → Actions → General**: workflow **Read and write** and
# **Allow GitHub Actions to create and approve pull requests** (for `GITHUB_TOKEN`),
# unless you use a PAT below. The repository must also **Allow auto-merge** under
# **Settings → General → Pull requests** (and a compatible merge method, e.g. squash).
#
# Recommended: repository secret **BPFORBES_PAT** (automation PAT). Fallback:
# **VERSION_LOCK_PAT**. Checkout, create-pull-request, and `gh` use
# `BPFORBES_PAT || VERSION_LOCK_PAT || GITHUB_TOKEN`.
#
# Needs: permissions contents: write, pull-requests: write.

name: Version lock on merge

on:
  push:
    branches: [develop]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: version-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-locked-from-entries:
    name: Sync version/locked from entries
    runs-on: ubuntu-latest
    # Avoid a loop when the tip commit is already our sync squash (optional guard).
    if: "${{ github.event.head_commit == null || !startsWith(github.event.head_commit.message, 'chore(version): sync') }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BPFORBES_PAT || secrets.VERSION_LOCK_PAT || secrets.GITHUB_TOKEN }}

      - name: Finalize version (copy entries → locked, skip preproduction */)
        run: ./scripts/finalize_version_locked.sh

      - name: Stamp RELEASE_DATE on .ver files (merge calendar date)
        run: ./scripts/stamp_version_release_date.sh

      - name: Regenerate version header
        run: ./scripts/gen_version_def.sh

      - name: Detect changes
        id: prep
        run: |
          set -euo pipefail
          # finalize_version_locked.sh refreshes version/locked/ from entries (skipping
          # top-level preproduction */ dirs); gen_version_def.sh may update version_def.h.
          # Do not rely on `git diff --quiet HEAD` alone: it ignores untracked files.
          if [[ -z "$(git status --porcelain -- version/locked userland/shell/version_def.h)" ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No version/locked or version_def.h changes after finalize."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request with synced locked + header
        id: cpr
        if: steps.prep.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.BPFORBES_PAT || secrets.VERSION_LOCK_PAT || secrets.GITHUB_TOKEN }}
          commit-message: "chore(version): sync version/locked from entries after merge"
          branch: cursor/version-lock-from-entries-${{ github.run_id }}
          title: "chore(version): sync version/locked from entries after merge to develop"
          body: |
            Automated sync after a push to `develop`: ran `finalize_version_locked.sh`, `stamp_version_release_date.sh`, and `gen_version_def.sh`.

            **Branch protection** on `develop` (PR-only, required checks, verified signatures) means the sync cannot land as a direct push. Merge this PR to publish `version/locked/` and `userland/shell/version_def.h`.

            `stamp_version_release_date.sh` appends `RELEASE_DATE=YYYY-MM-DD` (merge day) to any `*.ver` under `version/locked` and `version/entries` that does not already declare `RELEASE_DATE`, keeping the trees identical before changelog generation in CI.

            Uses **`BPFORBES_PAT`** or **`VERSION_LOCK_PAT`** when set; otherwise **`GITHUB_TOKEN`**. Auto-merge is enabled by the workflow when the PR is opened (waits for all required checks configured as required on the branch).

      - name: Enable auto-merge for version sync PR
        if: ${{ steps.prep.outputs.has_changes == 'true' && steps.cpr.outputs.pull-request-number != '' }}
        env:
          GH_TOKEN: ${{ secrets.BPFORBES_PAT || secrets.VERSION_LOCK_PAT || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          num="${{ steps.cpr.outputs.pull-request-number }}"
          op="${{ steps.cpr.outputs.pull-request-operation }}"
          if [[ "$op" != "created" && "$op" != "updated" ]]; then
            echo "Skipping auto-merge (pull-request-operation=$op)."
            exit 0
          fi
          # Queue merge when branch protections + required checks succeed (GitHub "auto-merge").
          if gh pr merge "$num" --repo "${{ github.repository }}" --auto --squash; then
            echo "Enabled auto-merge (squash) on PR #$num"
          else
            echo "::warning::Could not enable auto-merge on PR #$num (allow auto-merge + squash merge in repo settings, or merge manually)."
          fi
