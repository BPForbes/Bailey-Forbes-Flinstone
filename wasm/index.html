<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Flinstone Shell (WASM)</title>
  <!--
    Default `make wasm` uses pthreads + SharedArrayBuffer → needs COOP+COEP headers
    (e.g. `make wasm-serve` with the small C helper, or another reverse proxy).

    GitHub Pages: use `make wasm-pages` (no pthreads; no extra headers required).
  -->
  <style>
    body { font-family: system-ui, sans-serif; margin: 16px; background: #111; color: #ddd; }
    h1 { font-size: 1.15rem; }
    p { max-width: 52rem; line-height: 1.45; opacity: 0.9; }
  </style>
</head>
<body>
  <h1>Flinstone Shell · WebAssembly</h1>
  <p>Loads the embedded x86 VM in the browser (same as <code>-Virtualization -y -vm</code>). For pthreads, build with <code>make wasm</code> and serve with COOP/COEP headers (e.g. <code>make wasm-serve</code>). For GitHub Pages, use <code>make wasm-pages</code> (single-threaded; no extra headers).</p>
  <script type="module">
    import createModule from './BPForbes_Flinstone_Shell.js';
    try {
      await createModule(globalThis.Module || {});
    } catch (err) {
      const pre = document.createElement('pre');
      pre.style.color = '#f85149';
      pre.textContent = 'WASM init failed: ' + (err && err.stack ? err.stack : String(err));
      document.body.appendChild(pre);
      throw err;
    }
  </script>
</body>
</html>
