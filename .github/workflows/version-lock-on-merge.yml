# After a push to develop, copy version/entries → version/locked and regenerate
# userland/shell/version_def.h. If anything changed, opens a PR into develop (do not
# push that commit directly to develop — branch rules usually require a PR, checks,
# and often verified signatures).
#
# Requires **Settings → Actions → General**: workflow **Read and write** and
# **Allow GitHub Actions to create and approve pull requests** (for `GITHUB_TOKEN`),
# unless you use a PAT below.
#
# Recommended: repository secret **BPFORBES_PAT** (full-repo PAT for automation).
# Fallback secret **VERSION_LOCK_PAT** is still accepted. Checkout and
# create-pull-request use `BPFORBES_PAT || VERSION_LOCK_PAT || GITHUB_TOKEN`.
#
# Needs: permissions contents: write, pull-requests: write.

name: Version lock on merge

on:
  push:
    branches: [develop]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: version-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-locked-from-entries:
    name: Sync version/locked from entries
    runs-on: ubuntu-latest
    # Avoid a loop when the tip commit is already our sync squash (optional guard).
    if: "${{ github.event.head_commit == null || !startsWith(github.event.head_commit.message, 'chore(version): sync') }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BPFORBES_PAT || secrets.VERSION_LOCK_PAT || secrets.GITHUB_TOKEN }}

      - name: Finalize version (copy version/entries to version/locked)
        run: ./scripts/finalize_version_locked.sh

      - name: Regenerate version header
        run: ./scripts/gen_version_def.sh

      - name: Detect changes
        id: prep
        run: |
          set -euo pipefail
          # Do not use `git diff --quiet HEAD -- …` alone: it ignores untracked files.
          # finalize_version_locked.sh can add new version/locked/*.ver while gen_version_def.sh
          # leaves version_def.h unchanged — still must open a PR. `git status --porcelain`
          # includes untracked paths under version/locked/.
          if [[ -z "$(git status --porcelain -- version/locked userland/shell/version_def.h)" ]]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No version/locked or version_def.h changes after finalize."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request with synced locked + header
        if: steps.prep.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.BPFORBES_PAT || secrets.VERSION_LOCK_PAT || secrets.GITHUB_TOKEN }}
          commit-message: "chore(version): sync version/locked from entries after merge"
          branch: cursor/version-lock-from-entries-${{ github.run_id }}
          title: "chore(version): sync version/locked from entries after merge to develop"
          body: |
            Automated sync after a push to `develop`: ran `finalize_version_locked.sh` and `gen_version_def.sh`.

            **Branch protection** on `develop` (PR-only, required checks, verified signatures) means the sync cannot land as a direct push. Merge this PR to publish `version/locked/` and `userland/shell/version_def.h`.

            Uses repository secret **`BPFORBES_PAT`** (or legacy **`VERSION_LOCK_PAT`**) when set; otherwise **`GITHUB_TOKEN`** (enable **Allow GitHub Actions to create and approve pull requests** in repo Actions settings if not using a PAT). If PR branches require signed commits, use a PAT or add a bypass for `github-actions[bot]`, or run `make finalize-version-locked` locally and open a normal PR.
