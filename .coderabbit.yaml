# CodeRabbit configuration — https://docs.coderabbit.ai
language: en-US

reviews:
  profile: assertive

  # Applied to all reviewed paths unless overridden by path_instructions below.
  instructions: |
    ## Version & releases

    **Shipped version** comes from all **`version/locked/**/*.ver`** files (recursive): the highest **A.B.C** is emitted into **`userland/shell/version_def.h`** by **`scripts/gen_version_def.sh`** (also via **`make`**). Author **`version/entries/`** (root **`.ver`** and optional **`preproduction A.B.C/`** subtrees for **`PRERELEASE=1`** — you may commit **`PRERELEASE=1`** at the entries root on same-repo PRs; CI runs **`relocate_root_prerelease_ver_to_preproduction.sh`** before layout checks; **`finalize_version_locked.sh`** does **not** copy **`preproduction */`** into **`version/locked`** until promotion merges a root GA **`.ver`**). Pushing to **`develop`** runs **Version lock on merge** (**relocate**, then copies **entries → locked** with that exclusion, regenerates the header, opens a PR into **`develop`** when there are changes). **`scripts/gen_version_changelog.c`** reads **`version/locked`** recursively, then CI builds with **`CHANGELOG_CI=1`**. **Maintainers** may run **`make finalize-version-locked`** locally before merge.

    **AI-authored feature PRs:** On the **first** substantive code change, **add** **`version/entries/*.ver`** (or **`preproduction A.B.C/`** rows) if none exists yet for that PR. Prefer **one** root **`.ver`** revised in place for a **single GA** change; for an **in-flight milestone** under **`preproduction */`**, iterate with **`DEV_VERSION`** or **additional `*.ver` files in that same directory**—do **not** add a **lower A.B.C** root entry (semver backtracking) unless a **human maintainer** explicitly requests that separate release. **Do not** commit **`version/locked/**`** or **`userland/shell/version_def.h`** in those PRs (automation publishes them after merge to **`develop`**). Keep **`version/entries/ABOUT.txt`** byte-identical to the merge target’s **`version/locked/ABOUT.txt`** while **`version/locked/`** matches the target.

    ### Lock system — never edit historical published files

    - **Do not** approve edits to paths under **`version/locked/`** that already exist on the **merge base / target branch** (published record). New release prose: add **`version/entries/*.ver`**; **`version/locked/`** updates when the **Version lock** automation PR merges to **`develop`** (or via **`finalize_version_locked.sh`** run by **maintainers** locally).
    - **`version/entries/`** may contain **extra** `.ver` files not yet in **`version/locked/`** until that merge (or a local finalize). CI requires every **`version/locked/`** file to **byte-match** the same relative path under **`version/entries/`** (`check_version_locked_subset_of_entries.sh`).
    - AI-assisted refactors must **exclude** historical **`version/locked/**`** from bulk edits.

    When reviewing a PR that merges **incoming → base** (e.g. `bug/*` → `develop`, `develop` → `main`):

    1. Compare the **target branch** published **`VERSION`** (`userland/shell/version_def.h`) to the **incoming** release recorded in **`version/entries/*.ver`** (must be strictly greater when the PR does not already update **`version/locked/`**), or to incoming **`VERSION`** if the PR includes a maintainer finalize of **`version/locked/`**.
    2. The **incoming** version must be **strictly greater** than the target for that merge (typically exactly one semver bump on the appropriate component).
    3. If both report the **same** version (e.g. both `2.0.0`), request an update: bump the incoming **entries** so it is **one step ahead** of the target for the change type (example: `bug/*` → `develop` with both at `2.0.0` → bump incoming to `2.0.1`).
    4. Ensure new bumps add or extend **`version/entries/*.ver`** (usually **one** file per feature PR, edited in place as the PR evolves); after push to **`develop`**, **Version lock on merge** syncs **`version/locked/`** and **`version_def.h`** via an **automation PR** (or **maintainers** run **`make finalize-version-locked`** locally before merge if they need an early **`version/locked/`** update on the branch).

    **Automation version PRs:** PRs created **only** by **Version lock on merge** (`chore(version): sync…`, `cursor/version-lock-from-entries-*`) are housekeeping—**do not** auto-review or proactively queue deep review. **If a human requests a review**, review like any other PR.

    **Schema `A.B.C`:**

    - **A** — Major: architecture changes, large milestones, incompatible overhauls.
    - **B** — Minor: new features (backward compatible within the product).
    - **C** — Patch: bug fixes and small corrections.

    **Precedence (importance):** **`A` > `B` > `C`**. For each new release entry, bump **only** the **highest** precedence that applies to the release as a whole. **More significant** components (to the **left** of the bump) **stay the same**; **less significant** components (to the **right**) are **set to `0`**. Example: **`2.2.4` → `2.3.0`** for a minor release (`A` unchanged, `B` +1, `C` reset). **`2.3.7` → `3.0.0`** for a major release. **`2.3.0` → `2.3.1`** for a patch (only `C` increments).

    **Single bump rule:** If a change mixes milestone/architecture work, features, and bug fixes, **only increment the most significant applicable component** once (e.g. milestone + architecture → bump **A** only → **`3.0.0`** after **`2.x.y`**; do not also bump B/C for the same release).

    Remind authors: author under **`version/entries/`** (add **`.ver`** on first substantive change if none yet; **one** entry file per feature PR is typical). **AI PRs:** do **not** commit **`version/locked/**`** or **`userland/shell/version_def.h`**. **`version/locked/`** syncs when the **Version lock** PR merges to **`develop`** (or **maintainers** run **`finalize_version_locked`** locally). Then **`make`** / **`gen_version_def.sh`** on checkout reflects **`version/locked/`**. Changelog prose is CI/deployment-time, not default `make`.

    ## Comments vs code

    Prefer a rough balance of **about 15% comments to 85% code** in new or heavily touched areas: enough comments to explain non-obvious intent, invariants, and public contracts—avoid redundant narration of what the code already states line-by-line.

  path_instructions:
    - path: "version/**/*.ver"
      instructions: |
        **Authoring / locked** — `.ver` files: MAJOR/STANDARD/RELEASE, DESCRIPTION, optional RELEASE_DATE, optional **PRERELEASE** (**0**/**1**), optional **GM** (**0**/**1**, never **`1`** at entries root), optional **DEV_VERSION** (iteration; required **`>= 1`** with **`PRERELEASE=1`**). **`PRERELEASE=1`** rows must end under **`version/entries/preproduction A.B.C/`** (directory name matches semver; same-repo PR CI runs **`relocate_root_prerelease_ver_to_preproduction.sh`** first — you may commit them at the entries root briefly; fork PRs must relocate locally; see **`docs/versioning.md`**). Bump **`DEV_VERSION`** with **`scripts/bump_dev_version.sh`**. **`finalize_version_locked.sh`** does **not** copy **`preproduction */`** into **`version/locked`**. When **`GM=1`** on exactly one file in that folder, **`promote_preproduction_for_main.sh`** merges **all** prerelease rows into one root GA **`.ver`** under **`version/entries/`** without **`PRERELEASE`**, **`GM`**, or **`DEV_VERSION`**, removes **`preproduction *`** from **`version/entries`** (and from **`version/locked`** only if a legacy copy existed). **`VERSION`** in **`version_def.h`** is **A.B.C** only (recursive **`version/locked/**/*.ver`**). Agents: do **not** commit **`version/locked/**`** or **`version_def.h`** on typical feature PRs. If the **PR targets `main`**: require promotion already run — no **`preproduction *`** dirs and no **`PRERELEASE=1`**, **`GM=1`**, or **`DEV_VERSION=`** lines (CI **`check_version_main_prerelease_policy.sh`**).

    - path: "userland/shell/version_def.h"
      instructions: |
        This file is **generated** from **`version/locked/**/*.ver`** (`scripts/gen_version_def.sh` / `make`); do not hand-edit **`VERSION_*`**. Bumps follow **semver `A.B.C`** with precedence **`A` > `B` > `C`**: increment only the highest applicable component for the release, keep more-significant (left) components unchanged, set less-significant (right) components to **0** (e.g. **`2.2.4` → `2.3.0`**). Incoming branch version must exceed the target before merge; see AGENTS.md / CLAUDE.md.

    - path: "AGENTS.md"
      instructions: |
        Keep versioning rules in sync with `.coderabbit.yaml`, `.cursor/rules/versioning.mdc`, and CLAUDE.md.
