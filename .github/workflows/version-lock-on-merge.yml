# After a push to develop, copy version/entries → version/locked and regenerate
# userland/shell/version_def.h. If anything changed, open a PR to develop (do not
# push directly: branch rules often require PRs, status checks, and signed commits).
#
# Needs permissions: contents: write, pull-requests: write. Merge the opened PR
# to publish locked files (or add a ruleset bypass for github-actions[bot] on develop).

name: Version lock on merge

on:
  push:
    branches: [develop]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: version-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-locked-from-entries:
    name: Sync version/locked from entries
    runs-on: ubuntu-latest
    # Avoid a loop when the tip commit is already our sync squash (optional guard).
    if: "${{ github.event.head_commit == null || !startsWith(github.event.head_commit.message, 'chore(version): sync') }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Finalize version (copy version/entries to version/locked)
        run: ./scripts/finalize_version_locked.sh

      - name: Regenerate version header
        run: ./scripts/gen_version_def.sh

      - name: Detect changes
        id: prep
        run: |
          set -euo pipefail
          if git diff --quiet HEAD -- version/locked userland/shell/version_def.h; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No version/locked or version_def.h changes after finalize."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open pull request with synced locked + header
        if: steps.prep.outputs.has_changes == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "chore(version): sync version/locked from entries after merge"
          branch: cursor/version-lock-from-entries-${{ github.run_id }}
          title: "chore(version): sync version/locked from entries after merge to develop"
          body: |
            Automated sync after a push to `develop`: ran `finalize_version_locked.sh` and `gen_version_def.sh`.

            **Branch protection** on `develop` (PR-only, required checks, verified signatures) prevents pushing the sync commit directly. Merge this PR to publish `version/locked/` and `userland/shell/version_def.h`.

            If your org also requires signed commits on PR branches, add a bypass for `github-actions[bot]` or use a PAT with signing, or run `make finalize-version-locked` locally and open a normal PR.
