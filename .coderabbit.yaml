# CodeRabbit configuration — https://docs.coderabbit.ai
language: en-US

reviews:
  profile: assertive

  # Applied to all reviewed paths unless overridden by path_instructions below.
  instructions: |
    ## Version & releases

    **Shipped version** normally comes from all **`version/locked/**/*.ver`** files (recursive): the highest **A.B.C** is emitted into **`userland/shell/version_def.h`** as **`VERSION_*`** / **`VERSION`** by **`scripts/gen_version_def.sh`** (also via **`make`**). **Exception:** any **`version/entries/**/*.ver`** row with **`PRERELEASE=1`** and **`GM=1`** (newest by semver then **`DEV_VERSION`**) overrides **`VERSION_*`**, **`VERSION`**, and sets **`VERSION_LINE`** to plain **`A.B.C`**. Otherwise **`VERSION_LINE`** follows **`PRERELEASE=1`** rows when present. Author **`version/entries/`** root **`.ver`** files; for **`PRERELEASE=1`**, **do not** hand-add new **`.ver`** paths under **`preproduction A.B.C/`** on same-repo PRs—commit at the entries root and let CI **`prepare-version-entries`** run **`relocate_root_prerelease_ver_to_preproduction.sh`**, then **`stamp_version_entries_release_date.sh`** (entries root and **`preproduction */`**), before layout checks. **`PRERELEASE`** and **`GM`** must be **`0`** or **`1`** only when present. **`finalize_version_locked.sh`** does **not** copy **`preproduction */`** into **`version/locked`** until promotion merges a root GA **`.ver`**. Pushing to **`develop`** runs **Version lock on merge** (**relocate**, then copies **entries → locked** with that exclusion, regenerates the header, opens a PR into **`develop`** when there are changes). **`scripts/gen_version_changelog.c`** reads **`version/locked`** recursively, then CI builds with **`CHANGELOG_CI=1`**. **Maintainers** may run **`make finalize-version-locked`** locally before merge.

    **AI-authored feature PRs:** On the **first** substantive code change, **add** a **new** **`version/entries/A_B_C_slug.ver`** at the entries root **for that PR**. **Immutable rows:** do **not** edit any **`.ver`** path on the merge base—add **one new** root file per iteration. The new file may update **`DESCRIPTION` only** until merge. **`GM=1`:** add a **new** row (next **`DEV_VERSION`**); **`DESCRIPTION`** must start with **`A.B.C:`** and summarize the overall release (see **`docs/versioning.md`**). The **preproduction version** is **A.B.C** from **`preproduction <A>.<B>.<C>/`** directory names (**`PRERELEASE=1`** rows land there **after** relocate)—**AI (same-repo):** set **`DEV_VERSION`** to exactly **`N+1`** at most once vs **`develop`** on **your** new root row, then revise **`DESCRIPTION`** only; **never increase** **`DEV_VERSION`** again on that row (including via **`scripts/bump_dev_version.sh`**). **Maintainers** may use **`bump_dev_version.sh`** under maintainer policy. Alternatively use **additional root `*.ver` files** with the same semver and **`PRERELEASE=1`** for a new train; do **not** add a **new root** **`.ver`** whose **A.B.C** is **numerically below** that preproduction **A.B.C** (semver backtracking) unless a **human maintainer** explicitly requests that separate release. **Do not** commit **`version/locked/**`** in those PRs (automation publishes after merge to **`develop`**). **CI** (**`c-cpp.yml`** versioning job) runs **`gen_version_def.sh`** after relocate and may **push** **`userland/shell/version_def.h`** when it differs (same-repo feature pushes and pull requests; not for direct pushes to **`develop`**/**`main`**). **Do not** commit **`userland/shell/version_def.h`** on same-repo AI feature PRs. Run **`./scripts/gen_version_def.sh`** locally only to verify **`check_version_header_matches_locked`** when debugging offline; leave the header unstaged and let CI (**`c-cpp.yml`**) or **Version lock on merge** regenerate and publish it. Keep **`version/entries/ABOUT.txt`** byte-identical to the merge target’s **`version/locked/ABOUT.txt`** while **`version/locked/`** matches the target.

    **Merging multiple AI-authored feature branches:** When folding work from another agent branch (e.g. **`cursor/*`**, **`claude/*`**, **`codex/*`**) into the main feature branch for one PR, use **`git merge --no-ff <other-branch>`** so the combine point stays visible—avoid a silent fast-forward across unrelated agent work. After the merge, **delete** duplicate **`.ver`** files; **do not edit** immutable merge-base rows—fold combined prose into the **newest** **`.ver`** the combined PR adds or into **one new** root **`.ver`** with the next **`DEV_VERSION`**. Re-run **`./scripts/check_version_entries_semver_dev_unique.sh`**. Authoritative contributor copy: **AGENTS.md** § *AI feature-branch workflow*; IDE rules: **`.cursor/rules/versioning.mdc`**.

    ### Lock system — never edit historical published files

    - **Do not** approve edits to paths under **`version/locked/`** that already exist on the **merge base / target branch** (published record). New release prose: add **`version/entries/*.ver`**; **`version/locked/`** updates when the **Version lock** automation PR merges to **`develop`** (or via **`finalize_version_locked.sh`** run by **maintainers** locally).
    - **`version/entries/`** may contain **extra** `.ver` files not yet in **`version/locked/`** until that merge (or a local finalize). CI requires every **`version/locked/`** file to **byte-match** the same relative path under **`version/entries/`** (`check_version_locked_subset_of_entries.sh`).
    - AI-assisted refactors must **exclude** historical **`version/locked/**`** from bulk edits.

    When reviewing a PR that merges **incoming → base** (e.g. `bug/*` → `develop`, `develop` → `main`):

    1. Compare the **target branch** published **`VERSION`** (`userland/shell/version_def.h`) to the **incoming** release recorded in **`version/entries/*.ver`** (must be strictly greater when the PR does not already update **`version/locked/`**), or to incoming **`VERSION`** if the PR includes a maintainer finalize of **`version/locked/`**.
    2. The **incoming** version must be **strictly greater** than the target for that merge (typically exactly one semver bump on the appropriate component).
    3. If both report the **same** version (e.g. both `2.0.0`), request an update: bump the incoming **entries** so it is **one step ahead** of the target for the change type (example: `bug/*` → `develop` with both at `2.0.0` → bump incoming to `2.0.1`).
    4. Ensure new bumps **add** a **new** **`version/entries/*.ver`** (one new file per PR/iteration—do not edit merge-base rows); after push to **`develop`**, **Version lock on merge** syncs **`version/locked/`** and **`version_def.h`** via an **automation PR** (or **maintainers** run **`make finalize-version-locked`** locally before merge if they need an early **`version/locked/`** update on the branch).

    **Automation version PRs:** PRs created **only** by **Version lock on merge** (`chore(version): sync…`, `cursor/version-lock-from-entries-*`) are housekeeping—**do not** auto-review or proactively queue deep review. **If a human requests a review**, review like any other PR.

    **Schema `A.B.C`:**

    - **A** — Major: architecture changes, large milestones, incompatible overhauls.
    - **B** — Minor: new features (backward compatible within the product).
    - **C** — Patch: bug fixes and small corrections.

    **Precedence (importance):** **`A` > `B` > `C`**. For each new release entry, bump **only** the **highest** precedence that applies to the release as a whole. **More significant** components (to the **left** of the bump) **stay the same**; **less significant** components (to the **right**) are **set to `0`**. Example: **`2.2.4` → `2.3.0`** for a minor release (`A` unchanged, `B` +1, `C` reset). **`2.3.7` → `3.0.0`** for a major release. **`2.3.0` → `2.3.1`** for a patch (only `C` increments).

    **Single bump rule:** If a change mixes milestone/architecture work, features, and bug fixes, **only increment the most significant applicable component** once (e.g. milestone + architecture → bump **A** only → **`3.0.0`** after **`2.x.y`**; do not also bump B/C for the same release).

    Remind authors: author under **`version/entries/`** (add **`.ver`** on first substantive change if none yet; **one** entry file per feature PR is typical). **AI PRs:** do **not** commit changes under **`version/locked/`** (automation publishes after merge to **`develop`**). **CI** may **push** **`userland/shell/version_def.h`** after **`gen_version_def.sh`** when it differs; same-repo **AI PRs** must **not** commit that header (run **`./scripts/gen_version_def.sh`** locally for verification only). Then **`make`** / **`gen_version_def.sh`** on checkout reflects **`version/locked/`**, **`version/entries/`** prerelease **`.ver`** rows, and any **`GM=1`** override (see **`docs/versioning.md`**). Changelog prose is CI/deployment-time, not default **`make`**.

    ## Comments vs code

    Prefer a rough balance of **about 15% comments to 85% code** in new or heavily touched areas: enough comments to explain non-obvious intent, invariants, and public contracts—avoid redundant narration of what the code already states line-by-line.

  path_instructions:
    - path: "version/**/*.ver"
      instructions: |
        **Authoring / locked** — `.ver` files: MAJOR/STANDARD/RELEASE, DESCRIPTION, optional RELEASE_DATE, optional **PRERELEASE** (**0**/**1**), optional **PRERELEASE_TAG** (letters/digits/`._+-`; default **PRE** for ordinary prerelease **`VERSION_LINE`**), optional **GM** (**0**/**1**, never **`1`** at entries root), optional **DEV_VERSION** (iteration; required **`>= 1`** with **`PRERELEASE=1`**). **Immutable:** do **not** edit **`.ver`** paths on the merge base—**add one new** root file per iteration. **`GM=1` DESCRIPTION** must start with **`A.B.C:`** and summarize the overall release. **`(MAJOR, STANDARD, RELEASE, DEV_VERSION)`** must be **unique** across **`version/entries/**/*.ver`** (missing **`DEV_VERSION=`** counts as **0**); CI **`check_version_entries_semver_dev_unique.sh`**. **`PRERELEASE=1`** rows are **authored at the `version/entries/` root** on same-repo PRs (**do not** hand-add new paths under **`preproduction A.B.C/`**); CI runs **`relocate_root_prerelease_ver_to_preproduction.sh`** first (fork PRs must relocate locally; see **`docs/versioning.md`**). **Maintainers** may bump **`DEV_VERSION`** with **`scripts/bump_dev_version.sh`**. **AI (same-repo):** set **`DEV_VERSION`** to **`N+1`** at most once vs **`develop`**, then **`DESCRIPTION`** only on the **new** file—**never** raise **`DEV_VERSION`** again mid-PR. **`finalize_version_locked.sh`** does **not** copy **`preproduction */`** into **`version/locked`**. When **`GM=1`** on exactly one file in that folder, **`promote_preproduction_for_main.sh`** writes one root GA **`.ver`** under **`version/entries/`** from that row’s semver / **`A.B.C:`** **`DESCRIPTION`** only (no **`PRERELEASE`**, **`GM`**, or **`DEV_VERSION`**), deletes every prerelease **`.ver`** in the folder, and removes **`preproduction *`** from **`version/entries`** (and from **`version/locked`** only if a legacy copy existed). **`VERSION_*`** / **`VERSION`** in **`version_def.h`** normally follow **`version/locked/**/*.ver`**; a winning **`PRERELEASE=1`** + **`GM=1`** row under **`version/entries/`** overrides them and sets **`VERSION_LINE`** to plain **`A.B.C`**. Agents: do **not** commit changes under **`version/locked/`** on typical feature PRs; **CI** may push regenerated **`version_def.h`** when it drifts; same-repo **AI PRs** must **not** commit it (run **`./scripts/gen_version_def.sh`** locally for verification only). If the **PR targets `main`**: require promotion already run — no **`preproduction *`** dirs and no **`PRERELEASE=1`**, **`GM=1`**, or **`DEV_VERSION=`** lines (CI **`check_version_main_prerelease_policy.sh`**).

    - path: "userland/shell/version_def.h"
      instructions: |
        This file is **generated** from **`version/locked/**/*.ver`** and **`version/entries/**/*.ver`** (`scripts/gen_version_def.sh` / `make`): **`VERSION_*`** / **`VERSION`** from **locked**, **unless** a winning **`PRERELEASE=1`** + **`GM=1`** row under **`version/entries/`** overrides them and sets **`VERSION_LINE`** to plain **`A.B.C`**; otherwise **`VERSION_LINE`** follows **`PRERELEASE=1`** display rules. **AI:** do **not** hand-edit **`VERSION_MAJOR`**, **`VERSION_STANDARD`**, **`VERSION_PATCH`**, or **`VERSION_LINE`**, and do **not** commit header churn from running **`gen_version_def.sh`** after **`GM=1`** on **`.ver`**—**GitHub Actions** (`.github/workflows/c-cpp.yml` **version-requirements**, **Version lock on merge**) run **`gen_version_def.sh`** and publish those fields. Do not hand-edit **`VERSION_*`** for other reasons either. Bumps follow **semver `A.B.C`** with precedence **`A` > `B` > `C`**: increment only the highest applicable component for the release, keep more-significant (left) components unchanged, set less-significant (right) components to **0** (e.g. **`2.2.4` → `2.3.0`**). Incoming branch version must exceed the target before merge; see AGENTS.md / CLAUDE.md.

    - path: "AGENTS.md"
      instructions: |
        Keep versioning rules in sync with `.coderabbit.yaml`, `.cursor/rules/versioning.mdc`, and CLAUDE.md.
