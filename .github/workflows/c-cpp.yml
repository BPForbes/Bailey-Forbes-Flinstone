name: CI

on:
  push:
    branches: [ "develop", "main", "milestone/**", "claude/**", "feature/**", "cursor/**", "codex/**", "bug/**" ]
  pull_request:
    branches: [ "develop", "main" ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version-requirements:
    name: Versioning requirements
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.BPFORBES_PAT || secrets.VERSION_LOCK_PAT || secrets.GITHUB_TOKEN }}

      - name: Block fork PR when root PRERELEASE=1 needs automated relocate
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        run: bash scripts/relocate_root_prerelease_ver_to_preproduction.sh --dry-run-exit-if-needed

      - name: Prepare version/entries (relocate, normalize GM, promote, stamp dates)
        uses: ./.github/actions/prepare-version-entries

      - name: Regenerate userland/shell/version_def.h from .ver trees (entries + preproduction)
        run: ./scripts/gen_version_def.sh

      - name: Publish version/entries and version_def.h (same-repo only)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          BOT_NAME: github-actions[bot]
          BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- version/entries userland/shell/version_def.h; then
            echo "No version/entries or version_def.h changes after prepare-version-entries + gen_version_def.sh."
            exit 0
          fi
          if [[ "${GITHUB_REF}" == "refs/heads/develop" || "${GITHUB_REF}" == "refs/heads/main" ]]; then
            echo "Skipping push on develop/main (relocate + header checks run here; version-lock sync PR publishes when needed)."
            exit 0
          fi
          git config user.name "$BOT_NAME"
          git config user.email "$BOT_EMAIL"
          git add -A -- version/entries userland/shell/version_def.h
          git commit -m "chore(version): sync entries relocate, RELEASE_DATE stamp, and version_def.h (automated)"
          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            git push origin "HEAD:${GIT_HEAD_REF}"
          else
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Validate version locked immutability (PR only)
        if: github.event_name == 'pull_request'
        run: ./scripts/check_version_locked_immutable.sh "${{ github.event.pull_request.base.sha }}"

      - name: Verify version/locked matches subset of entries (entries may exceed locked)
        run: ./scripts/check_version_locked_subset_of_entries.sh

      - name: Verify version_def.h matches generator (version/locked)
        run: ./scripts/check_version_header_matches_locked.sh

      - name: Validate prerelease .ver directory layout (version/entries)
        run: ./scripts/check_version_prerelease_layout.sh

      - name: Unique MAJOR/STANDARD/RELEASE/DEV_VERSION across version/entries
        run: ./scripts/check_version_entries_semver_dev_unique.sh

      - name: Deps fetch scripts must verify archive SHA-256
        run: bash scripts/check_deps_fetch_verify_sha256.sh

      - name: Batch dispatch wires account commands (#220.7)
        run: bash scripts/check_batch_dispatch_account_cmds.sh

      - name: Main must ship GA .ver only (push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: ./scripts/check_version_main_prerelease_policy.sh

      - name: Main must ship GA .ver only (PR to main)
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: ./scripts/check_version_main_prerelease_policy.sh

  build-and-test-x86_64:
    name: Build & test (x86_64 GAS)
    needs: version-requirements
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync version checkout for build
        uses: ./.github/actions/sync-version-checkout

      - name: Install dependencies
        run: sudo apt-get update -y && sudo apt-get install -y gcc g++ binutils nasm libcunit1-dev libsqlite3-dev libssl-dev

      - name: Assemble changelog (CI-only source)
        run: |
          gcc -std=c11 -Wall -Wextra -O2 -o gen_version_changelog scripts/gen_version_changelog.c
          ./gen_version_changelog

      - name: Build (x86_64 GAS)
        run: make ARCH=x86_64_gas CHANGELOG_CI=1

      - name: Smoke test
        run: ./BPForbes_Flinstone_Shell -v

      - name: Test — memory ASM
        run: make test_mem_asm

      - name: Test — priority queue
        run: make test_priority_queue

      - name: Test — invariants
        run: make test_invariants

      - name: Test — fs_jail
        run: make test_fs_jail

      - name: Test — drivers
        run: make test_drivers

      - name: Test — userspace connection
        run: make test_userspace_connection

      - name: Build CUnit suite
        run: make BPForbes_Flinstone_Tests CHANGELOG_CI=1

      - name: Test — CUnit suite
        run: ./BPForbes_Flinstone_Tests

      - name: Build (x86_64 NASM)
        run: |
          make clean
          gcc -std=c11 -Wall -Wextra -O2 -o gen_version_changelog scripts/gen_version_changelog.c
          ./gen_version_changelog
          make ARCH=x86_64_nasm CHANGELOG_CI=1

  build-arm:
    name: Build (AArch64 cross)
    needs: version-requirements
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync version checkout for build
        uses: ./.github/actions/sync-version-checkout

      - name: Install cross-compiler
        run: sudo apt-get update -y && sudo apt-get install -y gcc g++ unzip curl perl make gcc-aarch64-linux-gnu g++-aarch64-linux-gnu binutils-aarch64-linux-gnu

      - name: Build SQLite for AArch64 cross link
        run: ./deps/fetch-sqlite-aarch64.sh

      - name: Build OpenSSL for AArch64 cross link
        run: ./deps/fetch-openssl-aarch64.sh

      - name: Assemble changelog (CI-only source)
        run: |
          gcc -std=c11 -Wall -Wextra -O2 -o gen_version_changelog scripts/gen_version_changelog.c
          ./gen_version_changelog

      - name: Build (ARM / AArch64)
        run: make ARCH=arm CHANGELOG_CI=1

  build-vm:
    name: Build & test (VM enabled)
    needs: version-requirements
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync version checkout for build
        uses: ./.github/actions/sync-version-checkout

      - name: Install dependencies
        run: sudo apt-get update -y && sudo apt-get install -y gcc g++ binutils nasm libsqlite3-dev libssl-dev

      - name: Assemble changelog (CI-only source)
        run: |
          gcc -std=c11 -Wall -Wextra -O2 -o gen_version_changelog scripts/gen_version_changelog.c
          ./gen_version_changelog

      - name: Build (VM)
        run: make VM_ENABLE=1 CHANGELOG_CI=1

      - name: Test — vm_layer_warning
        run: make test_vm_layer_warning
