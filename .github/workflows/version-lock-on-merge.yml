# After a push to develop, copy version/entries → version/locked and regenerate
# userland/shell/version_def.h. If anything changed, push a branch (not develop):
# branch protection usually blocks direct pushes and GITHUB_TOKEN often cannot
# create PRs unless the repo enables "Allow GitHub Actions to create and approve
# pull requests" (Settings → Actions → General). The job summary prints a compare
# URL to open the PR manually.
#
# Needs: permissions contents: write only.

name: Version lock on merge

on:
  push:
    branches: [develop]

permissions:
  contents: write

concurrency:
  group: version-lock-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sync-locked-from-entries:
    name: Sync version/locked from entries
    runs-on: ubuntu-latest
    # Avoid a loop when the tip commit is already our sync squash (optional guard).
    if: "${{ github.event.head_commit == null || !startsWith(github.event.head_commit.message, 'chore(version): sync') }}"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Finalize version (copy version/entries to version/locked)
        run: ./scripts/finalize_version_locked.sh

      - name: Regenerate version header
        run: ./scripts/gen_version_def.sh

      - name: Detect changes
        id: prep
        run: |
          set -euo pipefail
          if git diff --quiet HEAD -- version/locked userland/shell/version_def.h; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No version/locked or version_def.h changes after finalize."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Push sync branch (open PR via compare link in summary)
        if: steps.prep.outputs.has_changes == 'true'
        env:
          BRANCH: cursor/version-lock-from-entries-${{ github.run_id }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add version/locked userland/shell/version_def.h
          git commit -m "chore(version): sync version/locked from entries after merge"
          git push origin "HEAD:refs/heads/${BRANCH}"
          {
            echo "## Version lock: branch pushed"
            echo ""
            echo "Branch \`${BRANCH}\` has updated \`version/locked/\` and \`userland/shell/version_def.h\`."
            echo ""
            echo "**Open a PR into \`develop\`** (merge after CodeRabbit / checks as usual):"
            echo ""
            echo "https://github.com/${{ github.repository }}/compare/develop...${BRANCH}?expand=1"
            echo ""
            echo "To let Actions open PRs automatically in the future, enable **Settings → Actions → General → Workflow permissions → Read and write** and check **Allow GitHub Actions to create and approve pull requests** (org policy may still forbid it)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Pushed ${BRANCH}; see job summary for compare URL."
