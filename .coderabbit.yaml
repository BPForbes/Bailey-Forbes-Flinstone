# CodeRabbit configuration — https://docs.coderabbit.ai
language: en-US

reviews:
  profile: assertive

  # Applied to all reviewed paths unless overridden by path_instructions below.
  instructions: |
    ## Version & releases

    **Shipped version** comes from **`version/locked/*.ver`**: the highest **A.B.C** there is emitted into **`userland/shell/version_def.h`** by **`scripts/gen_version_def.sh`** (also via **`make`**). Author **`version/entries/*.ver`** files; pushing to **`develop`** runs **Version lock on merge** in GitHub Actions (copies **entries → locked**, regenerates the header, pushes a **sync branch**; use the Actions run summary compare link to open a PR if needed). **`scripts/gen_version_changelog.c`** reads **`version/locked`**, then CI builds with **`CHANGELOG_CI=1`**. **`make finalize-version-locked`** is still available locally before merge.

    ### Lock system — never edit historical published files

    - **Do not** approve edits to paths under **`version/locked/`** that already exist on the **merge base / target branch** (published record). New release prose: add **`version/entries/*.ver`**; **`version/locked/`** updates when someone **merges the automation sync branch** into **`develop`** (or via **`finalize_version_locked.sh`** locally).
    - **`version/entries/`** may contain **extra** `.ver` files not yet in **`version/locked/`** until that merge (or a local finalize). CI requires every **`version/locked/`** file to **byte-match** the same relative path under **`version/entries/`** (`check_version_locked_subset_of_entries.sh`).
    - AI-assisted refactors must **exclude** historical **`version/locked/**`** from bulk edits.

    When reviewing a PR that merges **incoming → base** (e.g. `bug/*` → `develop`, `develop` → `main`):

    1. Compare the **incoming branch** version string to the **merge base / target branch** version (same `VERSION` macro on each side).
    2. The **incoming branch version must be strictly greater** than the target branch version for that merge (typically exactly one semver bump on the appropriate component).
    3. If both branches report the **same** version (e.g. both `2.0.0`), request an update: bump the incoming branch so it is **one step ahead** of the target for the change type (example: `bug/*` → `develop` with both at `2.0.0` → bump incoming to `2.0.1`).
    4. Ensure new bumps add **`version/entries/*.ver`**; after push to **`develop`**, **Version lock on merge** syncs **`version/locked/`** and **`version_def.h`** via a **pushed sync branch** (merge via compare link in the Actions run summary, or run **`make finalize-version-locked`** locally before merge if you need an early **`version/locked/`** update on the branch).

    **Schema `A.B.C`:**

    - **A** — Major: architecture changes, large milestones, incompatible overhauls.
    - **B** — Minor: new features (backward compatible within the product).
    - **C** — Patch: bug fixes and small corrections.

    **Precedence (importance):** **`A` > `B` > `C`**. For each new release entry, bump **only** the **highest** precedence that applies to the release as a whole. **More significant** components (to the **left** of the bump) **stay the same**; **less significant** components (to the **right**) are **set to `0`**. Example: **`2.2.4` → `2.3.0`** for a minor release (`A` unchanged, `B` +1, `C` reset). **`2.3.7` → `3.0.0`** for a major release. **`2.3.0` → `2.3.1`** for a patch (only `C` increments).

    **Single bump rule:** If a change mixes milestone/architecture work, features, and bug fixes, **only increment the most significant applicable component** once (e.g. milestone + architecture → bump **A** only → **`3.0.0`** after **`2.x.y`**; do not also bump B/C for the same release).

    Remind authors: author under **`version/entries/`**; **`version/locked/`** updates after the **Version lock** sync branch is **merged to `develop`** (or run **`finalize_version_locked`** locally). Then **`make`** / **`gen_version_def.sh`** on checkout reflects **`version/locked/`**. Changelog prose is CI/deployment-time, not default `make`.

    ## Comments vs code

    Prefer a rough balance of **about 15% comments to 85% code** in new or heavily touched areas: enough comments to explain non-obvious intent, invariants, and public contracts—avoid redundant narration of what the code already states line-by-line.

  path_instructions:
    - path: "version/entries/*.ver"
      instructions: |
        **Authoring area** — new `.ver` files live here. For each file: MAJOR_VERSION, STANDARD_VERSION, RELEASE_VERSION (or MINOR_VERSION / VERSION_PATCH), and DESCRIPTION (<= 1023 chars). After merge, any path that also exists under **`version/locked/`** must stay byte-identical to locked until you intentionally change both via finalize.

    - path: "version/locked/**"
      instructions: |
        **Published snapshot** — copied from **`version/entries/`** via **`finalize_version_locked.sh`**. Do not approve hand edits that bypass **`version/entries/`**; never rewrite paths that already shipped on the target branch.

    - path: "userland/shell/version_def.h"
      instructions: |
        This file is **generated** from **`version/locked/*.ver`** (`scripts/gen_version_def.sh` / `make`); do not hand-edit **`VERSION_*`**. Bumps follow **semver `A.B.C`** with precedence **`A` > `B` > `C`**: increment only the highest applicable component for the release, keep more-significant (left) components unchanged, set less-significant (right) components to **0** (e.g. **`2.2.4` → `2.3.0`**). Incoming branch version must exceed the target before merge; see AGENTS.md / CLAUDE.md.

    - path: "AGENTS.md"
      instructions: |
        Keep versioning rules in sync with `.coderabbit.yaml`, `.cursor/rules/versioning.mdc`, and CLAUDE.md.
