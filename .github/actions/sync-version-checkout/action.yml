name: Sync version checkout for CI build
description: >-
  After the versioning job, pick up bot-pushed version files without abandoning
  the PR merge checkout: on pull_request, overlay userland/shell/version_def.h
  and version/entries from origin/<head>; on push, fast-forward to origin/<ref>.
  Then relocate idempotently and regenerate version_def.h.
runs:
  using: composite
  steps:
    - name: Sync version paths from branch tip (keep PR merge checkout on pull_request)
      if: >-
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'push' &&
         github.ref != 'refs/heads/develop' &&
         github.ref != 'refs/heads/main')
      env:
        GITHUB_TOKEN: ${{ github.token }}
        GIT_HEAD_REF: ${{ github.head_ref }}
        GIT_REF_NAME: ${{ github.ref_name }}
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        # checkout@v4 sets this on the initial clone; re-apply so composite-step fetch works.
        if [[ -n "${GITHUB_TOKEN}" ]]; then
          auth="AUTHORIZATION: basic $(printf 'x-access-token:%s' "${GITHUB_TOKEN}" | base64 | tr -d '\n')"
          git config --local http.https://github.com/.extraheader "${auth}"
        fi
        if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
          if [[ -n "${GIT_HEAD_REF}" ]]; then
            git fetch --no-tags origin "${GIT_HEAD_REF}"
          elif [[ -n "${PR_HEAD_SHA}" ]]; then
            git fetch --no-tags origin "${PR_HEAD_SHA}"
          else
            echo "sync-version-checkout: missing head ref and PR head SHA" >&2
            exit 1
          fi
          ref="origin/${GIT_HEAD_REF}"
          if ! git rev-parse --verify --quiet "${ref}" >/dev/null 2>&1; then
            ref="${PR_HEAD_SHA}"
          fi
          if git rev-parse --verify --quiet "${ref}" >/dev/null 2>&1; then
            git checkout "${ref}" -- userland/shell/version_def.h 2>/dev/null || true
            git checkout "${ref}" -- version/entries 2>/dev/null || true
          fi
        else
          git fetch --no-tags origin "${GIT_REF_NAME}"
          git checkout -B "${GIT_REF_NAME}" "origin/${GIT_REF_NAME}"
        fi

    - name: Prepare version/entries (relocate, normalize GM, stamp dates)
      uses: ./.github/actions/prepare-version-entries

    - name: Regenerate userland/shell/version_def.h from .ver trees
      shell: bash
      working-directory: ${{ github.workspace }}
      run: ./scripts/gen_version_def.sh
