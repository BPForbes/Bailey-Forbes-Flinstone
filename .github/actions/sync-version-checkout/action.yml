name: Sync version checkout for CI build
description: >-
  After the versioning job, pick up bot-pushed version files without abandoning
  the PR merge checkout: on pull_request, overlay userland/shell/version_def.h
  and version/entries from origin/<head>; on push, fast-forward to origin/<ref>.
  Then relocate idempotently and regenerate version_def.h.
runs:
  using: composite
  steps:
    - name: Sync version paths from branch tip (keep PR merge checkout on pull_request)
      if: >-
        (github.event_name == 'pull_request' &&
         github.event.pull_request.head.repo.full_name == github.repository) ||
        (github.event_name == 'push' &&
         github.ref != 'refs/heads/develop' &&
         github.ref != 'refs/heads/main')
      env:
        GIT_HEAD_REF: ${{ github.head_ref }}
        GIT_REF_NAME: ${{ github.ref_name }}
        GITHUB_TOKEN: ${{ github.token }}
      shell: bash
      working-directory: ${{ github.workspace }}
      run: |
        set -euo pipefail
        # actions/checkout in downstream jobs may leave origin as unauthenticated HTTPS;
        # version-requirements can push to the PR head, so we must fetch that tip here.
        git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
          git fetch origin --no-tags --prune "+refs/heads/${GIT_HEAD_REF}:refs/remotes/origin/${GIT_HEAD_REF}"
          if git rev-parse --verify --quiet "origin/${GIT_HEAD_REF}" >/dev/null; then
            git checkout "origin/${GIT_HEAD_REF}" -- userland/shell/version_def.h 2>/dev/null || true
            git checkout "origin/${GIT_HEAD_REF}" -- version/entries 2>/dev/null || true
          fi
        else
          git fetch origin --no-tags --prune "+refs/heads/${GIT_REF_NAME}:refs/remotes/origin/${GIT_REF_NAME}"
          git checkout -B "${GIT_REF_NAME}" "origin/${GIT_REF_NAME}"
        fi

    - name: Prepare version/entries (relocate, normalize GM, stamp dates)
      uses: ./.github/actions/prepare-version-entries

    - name: Regenerate userland/shell/version_def.h from .ver trees
      shell: bash
      working-directory: ${{ github.workspace }}
      run: ./scripts/gen_version_def.sh
